<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#16213e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Domino Score">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Domino Score</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    text-align: center;
    padding: 18px 12px 10px;
    background: #16213e;
    border-bottom: 2px solid #0f3460;
  }

  header h1 {
    font-size: 1.3rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #e2b96f;
  }

  .win-target {
    font-size: 0.75rem;
    color: #888;
    margin-top: 2px;
    letter-spacing: 0.05em;
  }

  /* ── Teams ── */
  .teams {
    display: flex;
    flex: 1;
  }

  .team {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 10px 12px;
    border-right: 1px solid #0f3460;
    position: relative;
    transition: background 0.3s;
  }
  .team:last-child { border-right: none; }
  .team.winner { background: rgba(226,185,111,0.08); }

  /* Team name */
  .team-name-display {
    font-size: 1rem;
    font-weight: bold;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #e2b96f;
    cursor: pointer;
    text-align: center;
    min-height: 1.4em;
    border-bottom: 1px dashed transparent;
    transition: border-color 0.2s;
  }
  .team-name-display:hover { border-color: #e2b96f55; }

  .team-name-input {
    font-size: 1rem;
    font-weight: bold;
    text-align: center;
    background: transparent;
    border: none;
    border-bottom: 1px solid #e2b96f;
    color: #e2b96f;
    width: 100%;
    outline: none;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* Score */
  .score-display {
    font-size: 4.5rem;
    font-weight: bold;
    line-height: 1;
    margin: 14px 0 6px;
    color: #fff;
    text-shadow: 0 0 20px rgba(226,185,111,0.3);
  }
  .team.winner .score-display { color: #e2b96f; }

  /* Progress bar */
  .progress-wrap {
    width: 80%;
    height: 6px;
    background: #0f3460;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #0f3460, #e2b96f);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .team.winner .progress-bar { background: #e2b96f; }

  /* Buttons */
  .btn-add {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #e2b96f;
    color: #1a1a2e;
    font-size: 2rem;
    font-weight: bold;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(226,185,111,0.35);
    transition: transform 0.1s, box-shadow 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-add:active { transform: scale(0.92); box-shadow: 0 2px 6px rgba(226,185,111,0.2); }

  /* Score input row */
  .score-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    width: 100%;
    justify-content: center;
  }

  .score-input {
    width: 70px;
    font-size: 1.2rem;
    text-align: center;
    background: #0f3460;
    border: 1px solid #e2b96f44;
    border-radius: 8px;
    color: #fff;
    padding: 8px 4px;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .score-input:focus { border-color: #e2b96f; }

  /* History */
  .history {
    font-size: 0.7rem;
    color: #555;
    margin-top: 10px;
    text-align: center;
    max-height: 52px;
    overflow-y: auto;
    line-height: 1.6;
    width: 100%;
    padding: 0 4px;
  }
  .history span { margin-right: 4px; }

  /* Winner banner */
  .winner-badge {
    display: none;
    position: absolute;
    top: 8px;
    right: 8px;
    background: #e2b96f;
    color: #1a1a2e;
    font-size: 0.6rem;
    font-weight: bold;
    letter-spacing: 0.1em;
    padding: 3px 7px;
    border-radius: 20px;
    text-transform: uppercase;
  }
  .team.winner .winner-badge { display: block; }

  /* Footer actions */
  footer {
    background: #16213e;
    border-top: 1px solid #0f3460;
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 12px;
  }

  .btn-action {
    flex: 1;
    max-width: 160px;
    padding: 11px 0;
    border: none;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: bold;
    letter-spacing: 0.05em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.15s;
  }
  .btn-action:active { opacity: 0.7; }

  .btn-undo { background: #0f3460; color: #aaa; }
  .btn-reset { background: #3a1a1a; color: #e07070; }

  /* Modal overlay */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }

  .modal {
    background: #16213e;
    border: 2px solid #e2b96f;
    border-radius: 16px;
    padding: 30px 24px;
    text-align: center;
    width: 85%;
    max-width: 320px;
    animation: pop 0.25s ease;
  }
  @keyframes pop {
    from { transform: scale(0.8); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  .modal h2 { color: #e2b96f; font-size: 1.5rem; margin-bottom: 6px; }
  .modal p  { color: #ccc; font-size: 0.9rem; margin-bottom: 20px; }

  .modal-btns { display: flex; gap: 10px; justify-content: center; }
  .modal-btns button {
    padding: 10px 22px;
    border-radius: 8px;
    border: none;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-continue { background: #e2b96f; color: #1a1a2e; }
  .btn-new-game { background: #0f3460; color: #e2b96f; }
</style>
</head>
<body>

<header>
  <h1>🁣 Domino</h1>
  <div class="win-target">First to 150 wins</div>
</header>

<div class="teams">
  <!-- Team A -->
  <div class="team" id="teamA">
    <div class="winner-badge">Winner!</div>
    <div class="team-name-display" id="nameA-display" onclick="editName('A')">Team A</div>
    <input class="team-name-input" id="nameA-input" value="Team A" style="display:none"
           onblur="saveName('A')" onkeydown="if(event.key==='Enter')saveName('A')">

    <div class="score-display" id="scoreA">0</div>
    <div class="progress-wrap">
      <div class="progress-bar" id="barA" style="width:0%"></div>
    </div>

    <button class="btn-add" onclick="addScore('A')">+</button>
    <div class="score-input-row">
      <input class="score-input" id="inputA" type="number" value="0" min="0" max="150"
             inputmode="numeric" placeholder="pts">
    </div>
    <div class="history" id="histA"></div>
  </div>

  <!-- Team B -->
  <div class="team" id="teamB">
    <div class="winner-badge">Winner!</div>
    <div class="team-name-display" id="nameB-display" onclick="editName('B')">Team B</div>
    <input class="team-name-input" id="nameB-input" value="Team B" style="display:none"
           onblur="saveName('B')" onkeydown="if(event.key==='Enter')saveName('B')">

    <div class="score-display" id="scoreB">0</div>
    <div class="progress-wrap">
      <div class="progress-bar" id="barB" style="width:0%"></div>
    </div>

    <button class="btn-add" onclick="addScore('B')">+</button>
    <div class="score-input-row">
      <input class="score-input" id="inputB" type="number" value="0" min="0" max="150"
             inputmode="numeric" placeholder="pts">
    </div>
    <div class="history" id="histB"></div>
  </div>
</div>

<footer>
  <button class="btn-action btn-undo" onclick="undo()">↩ Undo</button>
  <button class="btn-action btn-reset" onclick="confirmReset()">New Game</button>
</footer>

<!-- Win modal -->
<div class="modal-overlay" id="winModal">
  <div class="modal">
    <h2 id="winnerText">🏆 Team A Wins!</h2>
    <p id="winnerScore"></p>
    <div class="modal-btns">
      <button class="btn-continue" onclick="closeModal()">Keep Playing</button>
      <button class="btn-new-game" onclick="newGame()">New Game</button>
    </div>
  </div>
</div>

<!-- Reset modal -->
<div class="modal-overlay" id="resetModal">
  <div class="modal">
    <h2 style="color:#e07070">Reset?</h2>
    <p>All scores will be cleared.</p>
    <div class="modal-btns">
      <button class="btn-new-game" onclick="closeModal()">Cancel</button>
      <button class="btn-continue" style="background:#e07070" onclick="newGame()">Reset</button>
    </div>
  </div>
</div>

<script>
const WIN = 150;
const SAVE_KEY = 'domino_state';

// ── Persistence ──────────────────────────────────────────
function saveState() {
  const state = {
    scores,
    history,
    gameOver,
    names: {
      A: document.getElementById('nameA-display').textContent,
      B: document.getElementById('nameB-display').textContent
    }
  };
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
}

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}
// ─────────────────────────────────────────────────────────

let scores = { A: 0, B: 0 };
let history = [];
let gameOver = false;

// Restore saved state on load
const saved = loadState();
if (saved) {
  scores   = saved.scores   || { A: 0, B: 0 };
  history  = saved.history  || [];
  gameOver = saved.gameOver || false;

  ['A','B'].forEach(t => {
    const name = saved.names && saved.names[t] ? saved.names[t] : 'Team ' + t;
    document.getElementById('name'+t+'-display').textContent = name;
    document.getElementById('name'+t+'-input').value = name;
  });
}

function render() {
  ['A','B'].forEach(t => {
    document.getElementById('score'+t).textContent = scores[t];
    const pct = Math.min(100, (scores[t] / WIN) * 100);
    document.getElementById('bar'+t).style.width = pct + '%';
    const teamEl = document.getElementById('team'+t);
    teamEl.classList.toggle('winner', scores[t] >= WIN);
  });

  ['A','B'].forEach(t => {
    const rounds = history.filter(h => h.team === t).map(h => '+'+h.amount);
    document.getElementById('hist'+t).innerHTML = rounds.slice(-10).map(r => `<span>${r}</span>`).join('');
  });
}

function addScore(t) {
  if (gameOver) return;
  const input = document.getElementById('input'+t);
  const val = parseInt(input.value) || 0;
  if (val <= 0) { input.focus(); return; }

  history.push({ team: t, amount: val });
  scores[t] += val;
  input.value = 0;
  render();
  saveState();

  if (scores[t] >= WIN) {
    gameOver = true;
    saveState();
    const name = document.getElementById('name'+t+'-display').textContent;
    document.getElementById('winnerText').textContent = '🏆 ' + name + ' Wins!';
    document.getElementById('winnerScore').textContent =
      name + ' reached ' + scores[t] + ' points.';
    document.getElementById('winModal').classList.add('active');
  }
}

function undo() {
  if (!history.length) return;
  const last = history.pop();
  scores[last.team] -= last.amount;
  gameOver = false;
  render();
  saveState();
}

function editName(t) {
  document.getElementById('name'+t+'-display').style.display = 'none';
  const inp = document.getElementById('name'+t+'-input');
  inp.style.display = 'block';
  inp.focus();
  inp.select();
}

function saveName(t) {
  const inp = document.getElementById('name'+t+'-input');
  const val = inp.value.trim() || 'Team ' + t;
  inp.value = val;
  const disp = document.getElementById('name'+t+'-display');
  disp.textContent = val;
  disp.style.display = 'block';
  inp.style.display = 'none';
  saveState();
}

function confirmReset() {
  document.getElementById('resetModal').classList.add('active');
}

function newGame() {
  scores = { A: 0, B: 0 };
  history = [];
  gameOver = false;
  ['A','B'].forEach(t => document.getElementById('input'+t).value = 0);
  document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
  render();
  saveState();
}

function closeModal() {
  document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
  gameOver = false;
  saveState();
}

render();

// Register service worker for PWA install + offline support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
